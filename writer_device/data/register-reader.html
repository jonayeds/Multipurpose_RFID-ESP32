<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Reader — UniCard RFID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Beau+Rivage&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 150px);
        padding: 2rem var(--spacing);
      }
      .registration-card {
        width: 100%;
        max-width: 550px;
      }
      .form-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .form-header h1 {
        font-size: 2rem;
        color: var(--text-color);
        margin-bottom: 0.5rem;
      }
      .form-header p {
        color: var(--text-muted);
        font-size: 1rem;
      }
      .dynamic-section {
        display: none;
        padding: 1.25rem;
        background-color: #fcfcfc;
        border: 1px dashed var(--secondary-color);
        border-radius: var(--radius-md);
        margin-bottom: 1.25rem;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- ── Navigation ── -->
    <nav class="navbar">
      <span class="navbar-brand">UniCard RFID</span>
      <button
        class="nav-menu-toggle"
        id="mobile-menu-btn"
        aria-label="Toggle navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="register-card.html">Register Card</a></li>
        <li>
          <a href="register-reader.html" class="active">Register Reader</a>
        </li>
        <li><a href="login.html">Dashboard</a></li>
      </ul>
    </nav>

    <div class="form-container">
      <div class="card registration-card">
        <div class="form-header">
          <span
            class="highlight-text"
            style="font-size: 1.5em; display: block; margin-bottom: 0.5rem"
            >Hardware Setup</span
          >
          <h1>Register RFID Reader</h1>
          <p>Configure your reader device and set its operational mode.</p>
        </div>

        <form id="reader-registration-form">
          <!-- Static Field: Reader Password -->
          <div class="form-group">
            <label class="form-label" for="readerPassword"
              >Reader Password (Used for Dashboard Login)</label
            >
            <input
              type="password"
              id="readerPassword"
              name="readerPassword"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>

          <!-- Static Field: Reader Mode -->
          <div class="form-group">
            <label class="form-label" for="readerMode">Reader Mode</label>
            <select
              id="readerMode"
              name="readerMode"
              class="form-input"
              required
            >
              <option value="" disabled selected>
                Select operational mode...
              </option>
              <option value="identity_verification">
                Identity Verification
              </option>
              <option value="payment">Payment System</option>
              <option value="door_lock">Door Lock</option>
            </select>
          </div>

          <!-- Dynamic Section: Identity Verification -->
          <div id="section-identity" class="dynamic-section">
            <div class="form-group">
              <label class="form-label" for="allowedIds"
                >Allowed User IDs (comma separated)</label
              >
              <input
                type="text"
                id="allowedIds"
                name="allowedIds"
                class="form-input"
                placeholder="ID1, ID2, ID3..."
              />
            </div>
          </div>

          <!-- Dynamic Section: Payment -->
          <div id="section-payment" class="dynamic-section">
            <div class="form-group">
              <label class="form-label" for="deductionAmount"
                >Deduction Amount / Price ($)</label
              >
              <input
                type="number"
                id="deductionAmount"
                name="deductionAmount"
                class="form-input"
                placeholder="0.00"
                step="0.01"
                min="0"
              />
            </div>
          </div>

          <!-- Dynamic Section: Door Lock -->
          <div id="section-door" class="dynamic-section">
            <div class="form-group">
              <label class="form-label" for="doorPassword"
                >Door Password (Fixed 4 characters)</label
              >
              <input
                type="password"
                id="doorPassword"
                name="doorPassword"
                class="form-input"
                maxlength="4"
                minlength="4"
                placeholder="1234"
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 1rem"
          >
            Register Reader
          </button>
        </form>
      </div>
    </div>

    <script src="scripts.js"></script>
    <script>
      const modeSelect = document.getElementById("readerMode");
      const sections = {
        identity_verification: document.getElementById("section-identity"),
        payment: document.getElementById("section-payment"),
        door_lock: document.getElementById("section-door"),
      };

      // ── Handle Mode Change ──
      modeSelect.addEventListener("change", () => {
        const selectedMode = modeSelect.value;

        // Hide all dynamic sections first
        Object.values(sections).forEach(
          (section) => (section.style.display = "none"),
        );

        // Show the selected one
        if (sections[selectedMode]) {
          sections[selectedMode].style.display = "block";
        }
      });

      // ── Handle Form Submit ──
      document
        .getElementById("reader-registration-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const rawData = Object.fromEntries(formData.entries());
          const mode = rawData.readerMode;

          // Prepare the final object
          const payload = {
            readerPassword: rawData.readerPassword,
            readerMode: mode,
            allowedIds: null,
            deductionAmount: null,
            doorPassword: null,
          };

          // ── Validation and Mapping ──
          if (mode === "identity_verification") {
            if (!rawData.allowedIds || rawData.allowedIds.trim() === "") {
              alert("Please provide at least one allowed User ID.");
              return;
            }
            payload.allowedIds = rawData.allowedIds
              .split(",")
              .map((id) => id.trim())
              .filter((id) => id !== "");
          } else if (mode === "payment") {
            const amount = parseFloat(rawData.deductionAmount);
            if (isNaN(amount) || amount < 0) {
              alert("The Deduction Amount cannot be negative.");
              return;
            }
            payload.deductionAmount = amount;
          } else if (mode === "door_lock") {
            const doorPass = rawData.doorPassword;
            if (!doorPass || doorPass.length !== 4) {
              alert("The Door Password must be exactly 4 characters long.");
              return;
            }
            payload.doorPassword = doorPass;
          }

          console.log("Capturing reader data:", payload);

          try {
            // Demo API call to backend
            const response = await fetch(
              "http://writer.local/api/register-card",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              },
            );

            if (response.ok) {
              console.log("Registration successful");
            } else {
              throw new Error("Server responded with error");
            }
          } catch (error) {
            console.error("Error saving reader data:", error);
            alert(
              "Simulation Mode: Reader data captured. Redirecting to success page.",
            );
          }
        });
    </script>
  </body>
</html>
